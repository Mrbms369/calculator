<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#1e2530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ff3b3b"/>
      <stop offset="50%" stop-color="#3bff6a"/>
      <stop offset="100%" stop-color="#3b9bff"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Glowing ring (simulates the RGB title glow) -->
  <circle cx="256" cy="240" r="150" fill="none" stroke="url(#accent)" stroke-width="14" opacity="0.9"/>

  <!-- "BMs" text -->
  <text x="256" y="290"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="150"
        font-weight="800"
        letter-spacing="-6"
        text-anchor="middle"
        fill="url(#accent)">BMs</text>

  <!-- Small "Calculator" subtitle -->
  <text x="256" y="380"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="34"
        font-weight="600"
        letter-spacing="8"
        text-anchor="middle"
        fill="#8892a4">CALCULATOR</text>
</svg>